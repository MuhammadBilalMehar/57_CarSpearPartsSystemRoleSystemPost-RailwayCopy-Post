{% extends 'base.html' %}

{% block content %}

<section class="mx-auto max-w-2xl rounded-lg bg-white p-6 shadow-sm ring-1 ring-slate-200">
    <p class="text-sm font-bold uppercase tracking-wide text-indigo-700">New brand</p>
    <h1 class="mt-1 text-3xl font-extrabold text-slate-950">Add supplier brand</h1>
    <p class="mt-2 text-sm text-slate-500">Record a manufacturer or supplier name for your catalog.</p>

    <form method="POST" class="form-shell mt-6">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="mt-6 flex flex-wrap gap-3">
            <button type="submit" class="btn btn-success">Save Brand</button>
            <a href="{% url 'brand_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
