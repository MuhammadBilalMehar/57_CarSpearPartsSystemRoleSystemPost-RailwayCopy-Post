{% extends 'base.html' %}

{% block content %}

<section class="mx-auto max-w-3xl rounded-lg bg-white p-6 shadow-sm ring-1 ring-slate-200">
    <p class="text-sm font-bold uppercase tracking-wide text-amber-700">Edit vehicle</p>
    <h1 class="mt-1 text-3xl font-extrabold text-slate-950">Update vehicle fitment</h1>
    <p class="mt-2 text-sm text-slate-500">Adjust model and year information for accurate product matching.</p>

    <form method="POST" class="form-shell mt-6">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="mt-6 flex flex-wrap gap-3">
            <button type="submit" class="btn btn-success">Update Vehicle</button>
            <a href="{% url 'vehicle_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
